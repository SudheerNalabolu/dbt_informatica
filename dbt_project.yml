name: my_project
version: '1.0'
config-version: 2

profile: my_snowflake_profile

# models config
model-paths: ["models"]
macro-paths: ["macros"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
seed-paths: ["seeds"]
target-path: "target"

models:
  my_project:
    +materialized: view

tests:
  +store_failures: true
  +store_failures_as: table

